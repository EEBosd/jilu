<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fffaf7" />
    <title>一起走过 · 我们的出行记录</title>
    <meta name="description" content="用照片、视频和文字，收藏每一次和你一起出发的日子。" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="一起走过首页">
          <span class="brand-mark" aria-hidden="true">♥</span>
          <span class="brand-text">
            <span class="brand-name">一起走过</span>
            <span class="brand-sub">our little journal</span>
          </span>
        </a>
        <button class="button button-primary" id="new-trip" type="button">
          <span aria-hidden="true">＋</span> 记下一次出游
        </button>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <p class="eyebrow">OUR LITTLE JOURNAL</p>
            <h1 id="hero-title">把每一次出发，<br /><em>都记成我们的故事。</em></h1>
            <p class="hero-description">一段路，一张照片，一段视频。把值得回看的日子，慢慢收进这里。</p>
            <div class="hero-stats">
              <span id="trip-count">0 次出游</span>
              <span class="dot" aria-hidden="true">·</span>
              <span id="media-count">0 份回忆</span>
            </div>
          </div>
          <div class="hero-art" aria-hidden="true">
            <div class="hero-sun"></div>
            <div class="hero-heart"></div>
            <span class="hero-spark hero-spark-a">♥</span>
            <span class="hero-spark hero-spark-b">♥</span>
            <span class="hero-spark hero-spark-c">♥</span>
            <span class="hero-art-caption">the days we keep</span>
          </div>
        </section>

        <section class="journal" aria-labelledby="journal-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">MEMORIES</p>
              <h2 id="journal-title">我们的时间线</h2>
            </div>
            <span class="section-note">从最近的一次开始</span>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
          <div id="trip-list" class="trip-list"></div>
        </section>
      </main>

      <footer class="site-footer">
        <span class="footer-heart" aria-hidden="true">♥</span>
        每一段路，都有值得记住的风景。
      </footer>
    </div>

    <dialog id="editor" class="editor-dialog">
      <form id="trip-form" class="editor-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">NEW MEMORY</p>
            <h2 id="editor-title">记下一次出游</h2>
          </div>
          <button id="close-editor" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field">标题 <input name="title" maxlength="80" required placeholder="比如：海边的那个下午" /></label>
        <div class="form-row">
          <label class="field">日期 <input name="date" type="date" required /></label>
          <label class="field">地点 <input name="location" maxlength="80" placeholder="去了哪里？" /></label>
        </div>
        <label class="field">这一天 <textarea name="notes" maxlength="5000" rows="5" placeholder="写下想记住的故事……"></textarea></label>
        <div class="media-field">
          <span class="field-label">照片与视频</span>
          <p class="field-hint">支持 JPG、PNG、WebP 照片及 MP4、MOV 视频；视频每个不超过 50 MB。</p>
          <input id="media-input" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime" multiple />
          <div id="selected-media" class="selected-media"></div>
        </div>
        <div id="upload-status" class="upload-status" role="status" aria-live="polite"></div>
        <div class="dialog-actions">
          <button id="cancel-editor" class="button button-ghost" type="button">取消</button>
          <button id="save-trip" class="button button-primary" type="submit">保存记录</button>
        </div>
      </form>
    </dialog>

    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
